# THE VERIFICATION SUITE, OUTSIDE ANY SESSION (the external review of 21 Oct, Part B Step 3).
#
# On every push: the engine is built, STATE.md is checked (its length, its sections, every printed figure against the
# results files), and the fast verification suite runs, every file of it to a zero exit (research/tests/run-all.mjs).
# A failure is a red cross on the commit, which no hook inside a session can hide; the session prints this run's result
# at start. The full suite (some files take half an hour) runs on demand and every night.
name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast or all'
        default: 'all'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the engine from src/App.jsx
        run: python3 research/build-engine.py
      - name: STATE.md's check
        run: node research/solver/check-state.mjs
      - name: The verification suite
        run: |
          TIER=fast
          [ "${{ github.event_name }}" = "schedule" ] && TIER=all
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TIER="${{ github.event.inputs.tier }}"
          node research/tests/run-all.mjs "$TIER" -j 2
