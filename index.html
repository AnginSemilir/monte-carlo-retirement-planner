    <script>
      (function () {
        try {
          /*
           * The stored value is a PREFERENCE - 'light', 'dark' or 'system' - and what gets stamped on
           * the element is the RESOLVED theme, so the CSS only ever needs two blocks. 'classic' is the
           * old third theme and maps to light, which is what it collapsed into.
           */
          var t = localStorage.getItem('rp_theme_v1');
          if (t === 'classic') t = 'light';
          var pref = (t === 'light' || t === 'dark' || t === 'sepia' || t === 'system') ? t : 'system';
          var dark = pref === 'dark' || (pref === 'system'
            && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          // sepia is its own stamp and is never "dark": the class drives the few dark-only rules
          var stamp = pref === 'sepia' ? 'sepia' : (dark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', stamp);
          if (stamp === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

      /*
       * The wheel rocks a little under the pointer - a sign that it is a control and not a picture.
       * It sits on the BUTTON rather than on anything inside the SVG, because the frame loop owns
       * every transform in there and a CSS animation on the same element would fight it.
       */
      @keyframes rw-rock {
        0%, 100% { transform: rotate(-1.6deg); }
        50%      { transform: rotate(1.6deg); }
      }
      .rw-wheel:hover:not(:disabled) { animation: rw-rock 1.9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .rw-wheel:hover:not(:disabled) { animation: none; }
      }
    
      /*
       * THE SIMULATION SWEEP. While the Monte Carlo is running, the paths already on screen are re-drawn
       * left to right on a loop, staggered so they arrive as a shoal rather than in lockstep. It uses the
       * REAL last-known paths rather than invented ones, so the loading state is the chart waking up
       * rather than a spinner parked over it - and when the new answer lands the lines simply settle.
       *
       * Each path carries pathLength="1" as an SVG attribute, which normalises its length regardless of
       * how far it actually travels, so one dash setting sweeps them all at the same rate.
       */
      @keyframes sim-sweep {
        0%   { stroke-dashoffset: 1; }
        55%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; opacity: 0.18; }
      }
      .sim-sweep {
        stroke-dasharray: 1;
        animation: sim-sweep 1.6s ease-out infinite;
      }
      @media (prefers-reduced-motion: reduce) { .sim-sweep { animation: none; } }

      /*
       * PHONE LAYOUT UTILITIES.
       *
       * Three things Tailwind cannot express as a utility, kept here beside the other global CSS.
       *
       * .fill-viewport - 100dvh with a 100vh fallback, in that order so an old browser takes the first
       *   and a current one takes the second. dvh is the only unit that tracks a mobile URL bar sliding
       *   in and out; 100vh alone leaves a fullscreen chart overflowing by the height of that bar.
       *
       * .bleed - cancels the page gutter so a chart can run to both edges of the screen. 2.25rem is the
       *   sum of the two paddings above it: the page's p-4 (1rem) plus the card's p-5 (1.25rem). It is a
       *   media query rather than a `md:` variant because it must never apply on desktop, where the
       *   gutters are wider and a bleeding chart would escape the card entirely.
       *
       * .wide-chart - the opposite problem at the other end. The page is capped at max-w-7xl (1280px), so
       *   the chart measured 1,238px wide on a 1366, a 1440 and a 1920 screen alike: on a large monitor
       *   that leaves 682px of empty page beside the thing people came to look at. The cap is right for
       *   prose and wrong for a chart, so only the chart card escapes it, and only from 1536px up. 6rem
       *   each side rather than the 8rem that would reach the edge, so a 1536px window keeps a 32px
       *   gutter and nothing can overflow the page.
       *
       * .touch-ui - touch-action: manipulation removes the ~300ms click delay browsers keep in case a tap
       *   turns out to be a double-tap-to-zoom. Applied only when the pointer is coarse.
       */
      .fill-viewport { height: 100vh; height: 100dvh; }
      @media (max-width: 767px) { .bleed { margin-left: -2.25rem; margin-right: -2.25rem; } }
      /*
       * .bleed-tight - the same idea for a card with p-3 rather than p-5. 1.75rem is the page's p-4 (1rem)
       *   plus that card's p-3 (0.75rem). The streamlined page's phone chart card is one of those, and it
       *   was using .bleed: 0.5rem too far each side, which is exactly the 7px of horizontal scroll that
       *   page had. A bleed has to be the sum of the paddings it is cancelling, not a constant.
       */
      @media (max-width: 767px) { .bleed-tight { margin-left: -1.75rem; margin-right: -1.75rem; } }
      @media (min-width: 1536px) { .wide-chart { margin-left: -6rem; margin-right: -6rem; } }
      /*
       * .swipe-x - the container whose content can be swiped between sections or steps. pan-y keeps
       *   vertical scrolling native and hands horizontal movement to the pointer listeners in swipe.js;
       *   without it, Chrome on Android claims the horizontal gesture first and the swipe never fires.
       *   Never `none`, which would take vertical scrolling with it.
       */
      .swipe-x { touch-action: pan-y; }
      /*
       * And the other half of the same problem: Chrome on Android turns a rightward drag near the left
       * edge into "go back", and touch-action does not stop that because it is not a pan, it is a
       * navigation. Measured: the first right-swipe on the projection deck left the site entirely.
       * overscroll-behavior-x on the document is what disables it; vertical overscroll (pull to refresh)
       * is left alone.
       */
      html, body { overscroll-behavior-x: none; }
      .touch-ui button, .touch-ui a, .touch-ui input, .touch-ui select, .touch-ui summary { touch-action: manipulation; }
      /*
       * One rule instead of sixty className edits: under a finger, every control that occupies its own
       * line gets a 44px minimum height. The widths were already fine - these controls stretch or carry
       * real labels - so height was the whole problem.
       *
       * The exclusions are deliberate. A checkbox and a radio are sized by their own box and are operated
       * through the label beside them; a range input is dragged rather than tapped, and forcing it taller
       * would put a 44px band of dead space around a 4px track. Controls that sit INSIDE a sentence are
       * exempt too - see the probe in research/ui-harnesses/lib/probes.cjs, which follows the same
       * WCAG exception rather than shoving 44px boxes into the middle of a paragraph.
       */
      @media (pointer: coarse) {
        .touch-ui button, .touch-ui select, .touch-ui summary,
        .touch-ui input:not([type="checkbox"]):not([type="radio"]):not([type="range"]) { min-height: 44px; }
        /* flex: none as well as a size - these sit in tight flex rows next to their label, where the
           default flex-shrink:1 lets the browser squeeze the box back below whatever width is set. */
        .touch-ui input[type="checkbox"], .touch-ui input[type="radio"] { width: 24px; height: 24px; flex: none; }
        .touch-ui input[type="range"] { height: 44px; }
      }

      /*
       * THE SAME IDEA A MOUSE IS ALSO OWED, AT THE SMALLER NUMBER.
       *
       * 44px is WCAG 2.5.5, which is AAA and about a fingertip. 24px is 2.5.8, which is AA and applies
       * whatever the pointer - and the desktop was failing it in a dozen places: block-level "read the
       * methodology" buttons 16 to 18px tall, a details summary at 16px, range sliders at 16px. The phone
       * passed those only because the rule above lifts everything to 44.
       *
       * A floor, not a size: an element selector loses to any Tailwind class, so anything that already
       * states its own height keeps it and this only catches what states nothing. The same exclusions as
       * above, for the same reasons - a checkbox is operated through its label, and a range input is
       * dragged. The range gets an explicit 24px because its default height is set by the track.
       */
      body button, body select, body summary,
      body input:not([type="checkbox"]):not([type="radio"]):not([type="range"]) { min-height: 24px; }
      body input[type="range"] { height: 24px; }

      /*
       * THE FULL PLANNER'S MONTE CARLO REVEAL, DONE BY THE BROWSER RATHER THAN BY REACT.
       *
       * It used to be driven by a requestAnimationFrame loop writing a number into React state ~60 times
       * a second. Every one of those frames rebuilt sixty sample paths through d3's curveMonotoneX and
       * wrote sixty new `d` attributes - about three thousand points re-interpolated per frame. Measured
       * on a 1400px desktop viewport before this existed: a median frame of 37ms (~27fps), p95 51ms,
       * worst 66ms, and 59 of 95 frames over the 32ms mark. On a phone it would be far worse.
       *
       * The streamlined page never had the problem, because it does what this now does: build the path
       * geometry ONCE and hand the animation to the compositor. `pathLength="1"` normalises every path to
       * unit length however far it actually travels, so a single dash setting sweeps them all at the same
       * rate regardless of their real geometry.
       *
       * The band fades in as the paths dissolve, rather than growing row by row, because a growing band
       * is per-frame geometry again and this is the same picture at a fraction of the cost.
       */
      @keyframes mc-draw    { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes mc-dissolve{ 0%, 55% { opacity: 0.45; } 100% { opacity: 0; } }
      @keyframes mc-settle  { from { opacity: 0; } to { opacity: 1; } }
      .mc-draw      { stroke-dasharray: 1; animation: mc-draw 1.5s ease-out forwards; }
      .mc-spaghetti { animation: mc-dissolve 2.3s ease-out forwards; }
      .mc-band      { opacity: 0; animation: mc-settle 0.7s ease-out 1.45s forwards; }
      /* Reduced motion gets the END of the animation, not the start of it: the settled band, no sweep. */
      @media (prefers-reduced-motion: reduce) {
        .mc-draw      { stroke-dasharray: none; animation: none; }
        .mc-spaghetti { animation: none; opacity: 0; }
        .mc-band      { opacity: 1; animation: none; }
      }
    
      /*
       * Emphasis without slant. <em> is the right tag for the 31 places that use it - "it does NOT cover",
       * "differences between players" - and the browser's default rendering for it is the one thing this
       * interface does not use anywhere. Weight carries the same emphasis and stays in the body face.
       */
      em { font-style: normal; font-weight: 600; color: rgb(var(--slate-800)); }

      /*
       * The page background belongs on the root element, not only on the app's outer div.
       *
       * Both apps paint themselves with `bg-slate-50`, which covers exactly as much as their content.
       * Anywhere the document shows through - the rubber-band area at the top of an overscroll, the
       * strip below a short page - the browser's own white shows instead, which on the dark theme reads
       * as the page having broken. Taking the same token the apps use keeps all three themes in step,
       * and it is set on <html> so it applies before React has mounted anything.
       */
      html { background: rgb(var(--slate-50)); }
    </style>
    <title>Can I Retire? — Monte Carlo Retirement Planner</title>
    <!--
      Sharing metadata. The description is the one sentence somebody sees in a link preview before they
      decide whether to click, so it says what the model does and who it is for rather than naming the
      technique. og:image is the favicon: a purpose-drawn card would be better, and this at least keeps
      the preview from falling back to a blank rectangle.
    -->
